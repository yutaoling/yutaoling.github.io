name: Deploy static homepage

on:
  push:
    branches: [main, master]
    paths-ignore: [README.md, LICENSE]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html styles.css content.js settings.js main.js .nojekyll _site/
          cp -R assets _site/assets
          # 保留根目录图片的路径，便于设置照片或替换校徽。
          find . -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' -o -name '*.svg' \) -exec cp {} _site/ \;
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
